<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | RLN Fashion World</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="description" content="Thank you for contacting RLN Fashion World. We will get back to you shortly.">
    <style>
        .thankyou-section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 5%;
        }

        .thankyou-icon {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            animation: fadeUp 0.8s ease forwards;
        }

        .thankyou-title {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 1rem;
            animation: fadeUp 0.9s ease forwards;
        }

        .thankyou-desc {
            color: var(--muted);
            font-size: 1.1rem;
            max-width: 480px;
            margin-bottom: 2.5rem;
            animation: fadeUp 1s ease forwards;
        }

        .thankyou-btn {
            animation: fadeUp 1.1s ease forwards;
        }
    </style>
</head>
<body>
    <header id="navbar">
        <a href="index.html" class="logo">
            <div class="logo-circle">
                <span class="brand-text">RLN</span>
            </div>
            <div class="logo-text">
                <span>RLN</span> <span class="brand-text">FASHION WORLD</span>
            </div>
        </a>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#about">About</a>
            <a href="index.html#blog">Blog</a>
            <a href="shop.html">Products</a>
            <a href="index.html#contact">Contact</a>
        </nav>
    </header>

    <main>
        <section class="thankyou-section">
            <div class="thankyou-icon">✅</div>
            <h1 class="thankyou-title">Message Sent!</h1>
            <p class="thankyou-desc">
                Thank you for reaching out to RLN Fashion World. We have received your message and will get back to you as soon as possible.
            </p>
            <a href="index.html" class="btn thankyou-btn">Back to Home</a>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
